<nav class="tracker-context-navigation" aria-label="Analysis">
  @for (destination of navigation.destinations; track destination.path) {
    <a
      [routerLink]="destination.path"
      [queryParamsHandling]="destination.preserveQueryParameters ? 'preserve' : null"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      {{ destination.label }}
    </a>
  }
</nav>

<router-outlet />
