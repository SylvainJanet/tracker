<section class="tracker-page">
  <header class="tracker-page-header">
    <h1>Summary</h1>
    <p>Select a calendar date to retrieve its daily record.</p>
  </header>

  <div class="tracker-form">
    <label class="tracker-control-label" for="summary-date">Date</label>

    <input
      #dateInput
      id="summary-date"
      class="tracker-input"
      data-testid="summary-date"
      type="date"
      required
      [value]="presenter.model().selectedDate"
      (change)="selectDate(dateInput.value)"
    />
  </div>

  @if (presenter.model().state; as state) {
    @switch (state.kind) {
      @case ('view') {
        <article class="tracker-panel tracker-panel--neutral" data-testid="summary-record">
          <h2>Daily record</h2>

          <dl class="tracker-details">
            <div>
              <dt>Date</dt>
              <dd>{{ state.view.date }}</dd>
            </div>
          </dl>
        </article>
      }

      @case ('problem') {
        <div class="tracker-panel tracker-panel--danger" role="alert">
          <h2>{{ state.title }}</h2>
          <p>{{ state.message }}</p>
        </div>
      }
    }
  }
</section>
